
name: Build and Release

on:
  push:
    branches:
      - 'release/**'
      - 'epic/**'

  schedule:
    # Run the nightly build once per day at 06:00 UTC
    - cron: '0 6 * * *'

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    env:
      RELEASE_BRANCH: ${{ github.ref_name }}

    outputs:
      version: ${{ steps.release-version.outputs.version }}
      branch: ${{ steps.release-branch.outputs.branch }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch semantic-release notes
        run: |
          if git ls-remote --exit-code origin refs/notes/semantic-release >/dev/null; then
            git fetch origin refs/notes/semantic-release:refs/notes/semantic-release
          else
            echo "::error::The semantic-release notes reference does not exist on origin."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: pnpm
          cache-dependency-path: comixed-webui/pnpm-lock.yaml

      - name: Install semantic-release
        run: |
          npm install --no-save --no-package-lock \
            semantic-release@25.0.9 \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/exec \
            @semantic-release/github

      - name: Configure epic prerelease identifier
        if: startsWith(github.ref_name, 'epic/')
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^epic/issue-([0-9]+)$ ]]; then
            ISSUE_ID="${BASH_REMATCH[1]}"
          else
            echo "::error::Epic branch must use the format epic/issue-1234"
            exit 1
          fi

          ISSUE_ID="$ISSUE_ID" node <<'EOF'
          const fs = require('fs');

          const config = JSON.parse(
            fs.readFileSync('.releaserc.json', 'utf8')
          );

          const epicBranch = config.branches.find(
            branch =>
              typeof branch === 'object' &&
              branch.name === 'epic/**'
          );

          if (!epicBranch) {
            throw new Error('Epic branch configuration not found');
          }

          epicBranch.prerelease = `epic.${process.env.ISSUE_ID}`;

          fs.writeFileSync(
            '.releaserc.json',
            JSON.stringify(config, null, 2) + '\n'
          );

          console.log(
            `Epic prerelease identifier: ${epicBranch.prerelease}`
          );
          EOF

      - name: Record existing tags
        run: |
          git tag --list | sort > "$RUNNER_TEMP/tags-before"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Determine released version
        id: release-version
        run: |
          git tag --list | sort > "$RUNNER_TEMP/tags-after"

          NEW_TAGS=$(comm -13 \
            "$RUNNER_TEMP/tags-before" \
            "$RUNNER_TEMP/tags-after")

          VERSION=""

          while IFS= read -r TAG; do
            if [[ "$TAG" =~ ^v[0-9] ]]; then
              VERSION="${TAG#v}"
              break
            fi
          done <<< "$NEW_TAGS"

          if [[ -n "$VERSION" ]]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Released version: $VERSION"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "No release was published."
          fi

      - name: Determine release branch
        id: release-branch
        run: |
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build application
        if: steps.release-version.outputs.version != ''
        run: mvn -B -DskipTests package

      - name: Upload release artifact
        if: steps.release-version.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: comixed-release
          path: '*.zip'
          if-no-files-found: error

  docker:
    name: Build and Publish Docker Image
    needs: release
    if: >-
      needs.release.outputs.version != '' &&
      startsWith(needs.release.outputs.branch, 'release/')
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: comixed-release
          path: comixed-release/target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
          tags: |
            comixed/comixed:${{ needs.release.outputs.version }}
            comixed/comixed:latest

  version-bump:
    name: Create Version Bump Pull Request
    needs: release
    if: >-
      needs.release.outputs.version != '' &&
      startsWith(needs.release.outputs.branch, 'release/')
    runs-on: ubuntu-latest

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.branch }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Update Maven version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          mvn -B versions:set-property \
            -Dproperty=revision \
            -DnewVersion="${VERSION}" \
            -DgenerateBackupPoms=false

      - name: Update Angular version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        working-directory: comixed-webui
        run: |
          pnpm pkg set "version=${VERSION}"

      - name: Create version bump pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/version-bump-${{ needs.release.outputs.version }}
          base: ${{ needs.release.outputs.branch }}
          delete-branch: true
          commit-message: >-
            chore(release): update version to
            ${{ needs.release.outputs.version }}
          title: >-
            chore(release): update version to
            ${{ needs.release.outputs.version }}
          body: |
            This pull request updates the project versions following
            the release of ${{ needs.release.outputs.version }}.

            - Updates the root Maven revision property.
            - Updates the Angular package version.

            These changes prepare the release branch for subsequent development.
          add-paths: |
            pom.xml
            comixed-webui/package.json
