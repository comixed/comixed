
name: Build and Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - epic/**
  push:
    branches:
      - release/**

concurrency:
  group: release-${{ github.event.pull_request.base.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Create Release
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true)

    runs-on: ubuntu-latest

    env:
      RELEASE_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}

    outputs:
      version: ${{ steps.release_version.outputs.version }}
      branch: ${{ env.RELEASE_BRANCH }}

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.10.1 --activate

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('comixed-webui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/commit-analyzer \
            @semantic-release/exec \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/release-notes-generator

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Determine released version
        id: release_version
        shell: bash
        run: |
          TAG=$(git tag --points-at HEAD --sort=-version:refname | head -n 1)

          if [[ "$TAG" =~ ^v[0-9] ]]; then
            VERSION="${TAG#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Released version: $VERSION"
          else
            echo "No release was published."
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release package
        if: steps.release_version.outputs.version != ''
        run: mvn -B -DskipTests package

      - name: Upload release package
        if: steps.release_version.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: comixed-release-zip
          path: comixed-release/target/*.zip
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Build and Push Docker Image
    needs: release
    if: needs.release.outputs.version != ''

    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: comixed-release-zip
          path: comixed-release/target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Docker tags
        id: docker_tags
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
          RELEASE_BRANCH: ${{ needs.release.outputs.branch }}
        run: |
          TAGS="comixed/comixed:${VERSION}"

          if [[ "$RELEASE_BRANCH" == release/* ]]; then
            TAGS="${TAGS}"$'\n'"comixed/comixed:latest"
          fi

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
          tags: ${{ steps.docker_tags.outputs.tags }}
