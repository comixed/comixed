  name: Build and Release

  on:
    push:
      branches:
        - main
        - 'release/**'
        - 'epic/**'

  permissions:
    contents: write
    issues: write
    pull-requests: write
    packages: write

  concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

  jobs:
    release:
      name: Create Release
      runs-on: ubuntu-latest

      env:
        RELEASE_BRANCH: ${{ github.ref_name }}

      outputs:
        version: ${{ steps.release-version.outputs.version }}
        branch: ${{ steps.release-branch.outputs.branch }}

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Set up Java
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '25'
            cache: maven

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '24.15.0'

        - name: Set up pnpm
          run: |
            corepack enable
            corepack prepare pnpm@12.10.1 --activate

        - name: Install semantic-release
          run: |
            npm install --no-save --no-package-lock \
              semantic-release@25.0.9 \
              @semantic-release/commit-analyzer \
              @semantic-release/release-notes-generator \
              @semantic-release/changelog \
              @semantic-release/exec \
              @semantic-release/git \
              @semantic-release/github

        - name: Run semantic-release
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: npx semantic-release

        - name: Determine released version
          id: release-version
          shell: bash
          run: |
            TAG=$(git tag --points-at HEAD --sort=-version:refname | head -n 1)
            
            if [[ "$TAG" =~ ^v[0-9] ]]; then
              VERSION="${TAG#v}"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "Released version: $VERSION"
            else
              echo "No release was published."
              echo "version=" >> "$GITHUB_OUTPUT"
            fi

        - name: Determine release branch
          id: release-branch
          run: |
            echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

        - name: Build Maven package
          if: steps.release-version.outputs.version != ''
          run: mvn -B -DskipTests package

        - name: Upload release artifact
          if: steps.release-version.outputs.version != ''
          uses: actions/upload-artifact@v4
          with:
            name: comixed-release
            path: comixed-release/target/*.zip
            if-no-files-found: error
            retention-days: 7

    docker:
      name: Publish Docker Image
      runs-on: ubuntu-latest
      needs: release
      if: needs.release.outputs.version != ''

      steps:
        - name: Checkout release tag
          uses: actions/checkout@v4
          with:
            ref: v${{ needs.release.outputs.version }}
            fetch-depth: 0

        - name: Download release artifact
          uses: actions/download-artifact@v4
          with:
            name: comixed-release
            path: comixed-release/target

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Prepare Docker tags
          id: docker-tags
          shell: bash
          env:
            VERSION: ${{ needs.release.outputs.version }}
            RELEASE_BRANCH: ${{ needs.release.outputs.branch }}
          run: |
            {
              echo "tags<<EOF"
              echo "comixed/comixed:${VERSION}"
            
              if [[ "$RELEASE_BRANCH" == release/* ]]; then
                echo "comixed/comixed:latest"
              fi
            
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

        - name: Build and push Docker image
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: ${{ steps.docker-tags.outputs.tags }}
