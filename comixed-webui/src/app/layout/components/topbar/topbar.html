<p-toolbar>
  <ng-template #start>
    <span id="cx-logo">ComiXed</span>

    @if (authenticated()) {
      <p-button
        id="home-button"
        [pTooltip]="'topbar.tooltip.home-button' | translate"
        icon="pi pi-home"
        severity="primary"
        [routerLink]="['/']"
      />

      @if (isAdmin().passed) {
        <p-button
          id="import-comics-button"
          [pTooltip]="'topbar.tooltip.import-button' | translate"
          icon="pi pi-file-import"
          severity="warn"
          [routerLink]="['/library/import']"
        />
      }

      <app-selected-comic-toolbar></app-selected-comic-toolbar>
    }
  </ng-template>

  <ng-template #end>
    @if (authenticated()) {
      <p-button
        id="logout-button"
        [pTooltip]="'topbar.tooltip.logout-button' | translate"
        icon="pi pi-sign-out"
        severity="danger"
      />
    }
  </ng-template>
</p-toolbar>
