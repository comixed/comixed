<span class="cx-logo">ComiXed</span>

<button
  id="dark-mode-button"
  mat-icon-button
  aria-label="Toggle Dark Mode"
  color="accent"
  (click)="appStore.toggleDarkMode()"
>
  @if (appStore.darkMode()) {
    <mat-icon>light_mode</mat-icon>
  } @else {
    <mat-icon>dark_mode</mat-icon>
  }
</button>
