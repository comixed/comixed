<p-toolbar>
  <ng-template #start>
    &nbsp;
    <span id="cx-logo">ComiXed</span>

    @if (currentUserStore.isAuthenticated()) {
      &nbsp;
      <p-button
        [pTooltip]="'topbar.tooltip.home-button' | translate"
        icon="pi pi-home"
        severity="primary"
        [routerLink]="['/']"
      />
    }

    @if (currentUserStore.isAdmin()) {
      &nbsp;
      <p-button
        [pTooltip]="'topbar.tooltip.import-button' | translate"
        icon="pi pi-file-import"
        severity="contrast"
        [routerLink]="['/library/import']"
      />
    }
  </ng-template>

  <ng-template #center>
    <app-library-statistics-panel></app-library-statistics-panel>
  </ng-template>

  <ng-template #end>
    @if (currentUserStore.isAuthenticated()) {
      <p-button
        [pTooltip]="'topbar.tooltip.logout-button' | translate"
        icon="pi pi-sign-out"
        severity="warn"
      />
    }
  </ng-template>
</p-toolbar>
