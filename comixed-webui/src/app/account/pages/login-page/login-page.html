<mat-card id="login-form-container" class="cx-detail-container cx-centered">
  <mat-card-title>
    <h2 class="cx-width-100 cx-justify-center">
      {{ "user.login-page.title" | translate }}
    </h2>
  </mat-card-title>

  <mat-card-content>
    <form [formGroup]="loginForm">
      <mat-form-field class="cx-width-100" required>
        <mat-label>{{ "user.login-page.label.email" | translate }}</mat-label>
        <input
          id="input-login-email"
          matInput
          type="email"
          formControlName="email"
          [placeholder]="'user.login-page.placeholder.email' | translate"
        />
      </mat-form-field>
      <mat-form-field class="cx-width-100" required>
        <mat-label>
          {{ "user.login-page.label.password" | translate }}
        </mat-label>
        <input
          id="input-login-email"
          matInput
          type="password"
          formControlName="password"
          [placeholder]="'user.login-page.placeholder.password' | translate"
        />
      </mat-form-field>
    </form>
  </mat-card-content>

  <mat-card-actions class="cx-justify-center">
    <button
      mat-raised-button
      color="primary"
      [disabled]="!loginForm.valid"
      (click)="onSubmitForm()"
    >
      <mat-label>{{ "user.login-page.button.submit" | translate }}</mat-label>
      <mat-icon>login</mat-icon>
    </button>
  </mat-card-actions>
</mat-card>
