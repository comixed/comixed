<p-card class="cx-width-100 cx-height-100">
  <ng-template #header>
    <h2>{{ publisherDetailStore.name() }}</h2>
  </ng-template>

  <p-table
    [value]="publisherDetailStore.series()"
    stripedRows
    [paginator]="true"
    [rows]="publisherDetailStore.totalSeries()"
    [rowsPerPageOptions]="[10, 25, 50, 100]"
    [loading]="false"
  >
    <ng-template #header>
      <tr>
        <th>{{ "publisher-detail-page.label.series-name" | translate }}</th>
        <th>{{ "publisher-detail-page.label.volume" | translate }}</th>
        <th>{{ "publisher-detail-page.label.in-library" | translate }}</th>
      </tr>
    </ng-template>

    <ng-template #body let-series>
      <tr>
        <td>
          <a
            [routerLink]="[
              '/collections/publisher',
              publisherDetailStore.name(),
              '/series',
              series.name
            ]"
          >
            {{ series.name }}
          </a>
        </td>
        <td>{{ series.volume }}</td>
        <td>{{ series.inLibrary }}</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
