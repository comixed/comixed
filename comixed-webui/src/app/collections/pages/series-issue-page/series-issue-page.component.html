<h2>
  {{
    "collections.series.list-issues-page.page-title"
      | translate
        : {
            publisher: publisherName$ | async,
            series: seriesName$,
            volume: volume$
          }
  }}
</h2>

<cx-comic-list-view
  [isAdmin]="isAdmin$ | async"
  [comics]="comics$ | async"
  [selectedIds]="selectedIds$ | async"
  [totalComics]="totalComics$ | async"
  [showFilter]="false"
  (selectAll)="onSelectAll($event)"
></cx-comic-list-view>
