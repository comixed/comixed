<h2>
  {{
    "collections.publishers.list-issues-page.page-title"
      | translate: { publisher: name$ | async }
  }}
</h2>

<app-comic-list-view
  [isAdmin]="(isAdmin$ | async) || false"
  [comics]="(comics$ | async) || []"
  [selectedIds]="(selectedIds$ | async) || []"
  [totalComics]="(totalComics$ | async) || 0"
  [showFilter]="false"
  (selectAll)="onSelectAll($event)"
></app-comic-list-view>
