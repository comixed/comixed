<p-card class="cx-width-100 cx-height-100">
  <ng-template #header>
    <h2>
      {{
        "tag-list-page.page-title" | translate: { tagType: tagStore.tagType() }
      }}
    </h2>
  </ng-template>

  <p-table
    [value]="tagStore.entries()"
    stripedRows
    [paginator]="true"
    [rows]="tagStore.size()"
    [rowsPerPageOptions]="[10, 25, 50, 100]"
    [loading]="false"
  >
    <ng-template #header>
      <tr>
        <th>{{ "tag-list-page.label.tag-value" | translate }}</th>
        <th>{{ "tag-list-page.label.comic-count" | translate }}</th>
      </tr>
    </ng-template>

    <ng-template #body let-tag>
      <tr>
        <td>{{ tag.tagValue }}</td>
        <td>{{ tag.comicCount }}</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
