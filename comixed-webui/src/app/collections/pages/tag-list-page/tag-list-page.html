<div class="cx-padding-15">
  <mat-paginator
    [pageIndex]="tagStore.index()"
    [pageSize]="tagStore.size()"
    showFirstLastButtons="true"
  ></mat-paginator>

  <mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <ng-container matColumnDef="tag-value">
      <mat-header-cell *matHeaderCellDef>
        {{ "collections.tag-list-page.label.tag-value" | translate }}
      </mat-header-cell>
      <mat-cell *matCellDef="let entry">
        <span>
          {{ entry.tagValue }}
        </span>
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="comic-count">
      <mat-header-cell *matHeaderCellDef>
        {{ "collections.tag-list-page.label.comic-count" | translate }}
      </mat-header-cell>
      <mat-cell *matCellDef="let entry">
        <span>
          {{ entry.comicCount }}
        </span>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="3">
        {{ "collections.tag-list-page.text.no-tags-found" | translate }}
      </td>
    </tr>
  </mat-table>
</div>
