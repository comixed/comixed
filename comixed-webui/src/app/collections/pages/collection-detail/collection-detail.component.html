<h2>
  {{
    "collection-detail.page-title"
      | translate
        : {
            tagType: tagType,
            tagValue: tagValue
          }
  }}
</h2>

<cx-comic-list-view
  class="cx-width-100"
  [isAdmin]="isAdmin$ | async"
  [comics]="comics$ | async"
  [totalComics]="totalComics$ | async"
  [coverYears]="coverYears$ | async"
  [coverMonths]="coverMonths$ | async"
  [selectedIds]="selectedIds$ | async"
  [comicBooksRead]="lastReadDates$ | async"
  [readingLists]="readingLists$ | async"
  [showAction]="false"
  (selectAll)="onSelectAll($event)"
></cx-comic-list-view>
