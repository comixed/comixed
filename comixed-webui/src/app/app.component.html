<app-navigation-bar
  class="cx-width-100"
  [user]="user$ | async"
  [sidebarOpened]="sidenav.opened"
  [accountBarOpened]="accountBar.opened"
  (toggleSidebar)="sidenav.toggle($event)"
  (toggleAccountBar)="accountBar.toggle($event)"
></app-navigation-bar>

@if (busy$ | async) {
  <div id="cx-busy-overlay">
    <div class="cx-centered cx-position-absolute">
      <img [src]="busyIconURL" alt="Busy, please wait..." />
    </div>
  </div>
}

<mat-sidenav-container
  id="app-primary-space"
  class="cx-width-100 cx-height-100"
>
  <mat-sidenav
    id="app-sidenav-container"
    #sidenav
    mode="over"
    (click)="sidenav.close()"
    position="start"
  >
    <app-side-navigation [user]="user$ | async"></app-side-navigation>
  </mat-sidenav>

  <mat-sidenav
    id="app-account-bar-container"
    #accountBar
    mode="over"
    position="end"
  >
    @if (!!(user$ | async)) {
      <app-edit-account-bar
        [user]="user$ | async"
        (closeSidebar)="accountBar.close()"
      ></app-edit-account-bar>
    }
  </mat-sidenav>

  <mat-sidenav-content #sidebar>
    <div id="app-content-container">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

<app-footer [user]="user$ | async"></app-footer>
