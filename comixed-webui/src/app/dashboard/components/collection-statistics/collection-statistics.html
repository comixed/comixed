<mat-card class="cx-width-100 cx-height-100">
  <mat-card-title>
    <h3 class="cx-width-100 cx-justify-center cx-no-text-wrap">
      {{ title }}
    </h3>
  </mat-card-title>
  <mat-card-content class="cx-padding-15">
    <img
      [src]="imageUrl"
      alt="imageAlt"
      style="float: inline-end; height: 75px"
    />
    {{ description }}
  </mat-card-content>
  <mat-card-footer class="cx-padding-15">
    <a [routerLink]="detailUrl">
      {{ "dashboard.statistics.text.view-more" | translate }}
    </a>
  </mat-card-footer>
</mat-card>
