<p-card class="cx-width-100p cx-height-100p">
  <ng-template #header>
    @if (!loading()) {
      <p-breadcrumb [model]="comic() | comicDetailTrail" [home]="home" />
    }
  </ng-template>

  <h2 class="cx-width-100p cx-justify-center">
    {{ comic() | comicTitle }}
  </h2>
  <div
    class="cx-width-100p cx-height-100p cx-height-100p cx-flex-content-container-row"
  >
    <div id="comic-cover-container">
      @if (comic()) {
        <app-comic-cover
          [comic]="comic()!"
          [loading]="loading()"
        ></app-comic-cover>
      }
    </div>
    <div class="cx-flex-content-grow-1 cx-scroll-y-auto">
      <p-tabs
        lazy
        scrollable
        class="cx-height-100p cx-overflow-y-auto"
        [value]="currentTab()"
        (valueChange)="onTabChanged($event)"
      >
        <p-tablist>
          <p-tab [value]="'publication'">
            {{ "comic-detail-page.label.publication" | translate }}
          </p-tab>
          <p-tab [value]="'story'">
            {{ "comic-detail-page.label.story" | translate }}
          </p-tab>
          <p-tab [value]="'pages'">
            <span>
              {{ "comic-detail-page.label.pages" | translate }}
              <p-badge [value]="pages().length" />
            </span>
          </p-tab>
          <p-tab [value]="'metadata'">
            {{ "comic-detail-page.label.metadata" | translate }}
          </p-tab>
        </p-tablist>
        <p-tabpanels>
          <p-tabpanel [value]="'publication'">
            <app-comic-publication-detail
              [comic]="comic()"
              [loading]="loading()"
              (updateComic)="onUpdateComic($event)"
            ></app-comic-publication-detail>
          </p-tabpanel>
          <p-tabpanel [value]="'story'">
            <app-comic-story-detail
              [comic]="comic()"
              [tags]="tags()"
            ></app-comic-story-detail>
          </p-tabpanel>
          <p-tabpanel [value]="'pages'">
            <app-comic-pages-detail
              [comic]="comic()"
              [loading]="loading()"
              [pages]="pages()"
            ></app-comic-pages-detail>
          </p-tabpanel>
          <p-tabpanel [value]="'metadata'">
            <app-comic-metadata-detail></app-comic-metadata-detail>
          </p-tabpanel>
        </p-tabpanels>
      </p-tabs>
    </div>
  </div>
</p-card>
