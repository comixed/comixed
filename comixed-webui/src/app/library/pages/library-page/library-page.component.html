<h2>
  {{
    "library.page-title." + (pageContent$ | async)
      | translate: { filtered: filtered$ | async }
  }}
</h2>

<div class="cx-fab-container-bottom-left">
  @if (unreadOnly$ | async) {
    <button
      id="toggle-unread-only-flag"
      mat-fab
      color="primary"
      [matTooltip]="'library.tooltip.toggle-unread-comics' | translate"
      (click)="onToggleUnreadOnly()"
    >
      @if (showReadOnly$ | async) {
        <mat-icon>mark_chat_read</mat-icon>
      }
      @if ((showReadOnly$ | async) === false) {
        <mat-icon>mark_chat_unread</mat-icon>
      }
    </button>
  }
</div>

<cx-comic-list-view
  [isAdmin]="isAdmin$ | async"
  [comics]="comics$ | async"
  [coverYears]="coverYears$ | async"
  [coverMonths]="coverMonths$ | async"
  [totalComics]="filteredCount$ | async"
  [showPageCount]="true"
  [comicBooksRead]="comicBooksRead$ | async"
  [selectedIds]="selectedIds$ | async"
  [readingLists]="readingLists$ | async"
  [unreadOnly]="unreadOnly$ | async"
  [showFilter]="(unreadOnly$ | async) === false || (selectedOnly$ | async)"
  (selectAll)="onSetAllComicsSelectedState($event)"
  (filtered)="filtered$.next($event)"
  (showing)="showing$.next($event)"
></cx-comic-list-view>
