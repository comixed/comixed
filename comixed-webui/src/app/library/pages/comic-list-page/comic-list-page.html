<p-card id="comic-list-page-card" class="cx-width-100p">
  <ng-template #header>
    <div class="cx-width-100p cx-justify-center">
      <p-breadcrumb [model]="trail()" [home]="home" />

      <div class="cx-spacer"></div>

      @if (readComics()) {
        <p-toggle-button
          id="read-comic-toggle"
          [ngModel]="readFlag()"
          onIcon="pi pi-circle-on"
          offIcon="pi pi-circle-off"
          [onLabel]="'comic-list-page.label.read-only' | translate"
          [offLabel]="'comic-list-page.label.unread-only' | translate"
          [pTooltip]="'comic-list-page.tooltip.toggle-unread' | translate"
          (onChange)="onToggleUnreadOnly()"
        />
      }
    </div>
  </ng-template>

  <app-comic-table
    [comics]="comicListEntries()"
    [first]="comicListFirst()"
    [rows]="comicListRows()"
    [total]="comicListTotalCount()"
    [busy]="comicListBusy()"
    (loadComics)="onLoad($event)"
    (selectAll)="onSelectAll($event)"
  ></app-comic-table>
</p-card>
