<p-card class="cx-width-100p cx-height-100p">
  <ng-template #header>
    <p-breadcrumb [model]="trail()" [home]="home" />
    <h2>
      {{ "tag-list-page.page-title" | translate: { tagType: tagType() } }}
    </h2>
  </ng-template>

  <p-table
    [value]="tagListEntries()"
    [lazy]="true"
    (onLazyLoad)="onLoad($event)"
    dataKey="tagValue"
    [paginator]="true"
    stripedRows
    [first]="tagListFirst()"
    [rows]="tagListRows()"
    [totalRecords]="tagListTotal()"
    [loading]="tagListBusy()"
  >
    <ng-template #header>
      <tr>
        <th>{{ "tag-list-page.label.tag-value" | translate }}</th>
        <th>{{ "tag-list-page.label.comic-count" | translate }}</th>
      </tr>
    </ng-template>

    <ng-template #body let-tag>
      <tr>
        <td>{{ tag.tagValue }}</td>
        <td>{{ tag.comicCount }}</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
