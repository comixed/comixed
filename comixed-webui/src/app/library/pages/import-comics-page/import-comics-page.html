<p-card class="cx-width-100p cx-height-100p">
  <ng-template #title>
    <p-breadcrumb [model]="trail()" [home]="home" />

    <form [formGroup]="importComicsForm">
      <p-input-group>
        <p-button
          id="load-comic-files-button"
          icon="pi pi-send"
          severity="primary"
          [disabled]="!importComicsForm.valid"
          (click)="onLoadComicFiles()"
        />

        <input
          pInputText
          id="root-directory-input"
          formControlName="directory"
          [placeholder]="
            'import-comics-page.placeholder.directory-input' | translate
          "
          type="text"
          class="cx-width-75p"
        />

        <p-select
          formControlName="maximum"
          [options]="maximumOptions"
          optionLabel="label"
          optionValue="value"
          [placeholder]="
            'import-comics-page.placeholder.maximum-input' | translate
          "
        />

        <p-button
          id="import-comic-files-button"
          icon="pi pi-cloud-upload"
          severity="primary"
          [label]="comicFileSelectedCount().toString()"
          [pTooltip]="
            'import-comics-page.tooltip.import-comics-button'
              | translate: { selected: comicFileSelectedCount() }
          "
          [disabled]="comicFileSelectedCount() === 0"
          (click)="onImportComicFiles()"
        />
      </p-input-group>
    </form>
  </ng-template>

  <p-table
    #filetable
    [value]="comicFileList()"
    stripedRows
    [paginator]="true"
    paginatorPosition="both"
    [rows]="10"
  >
    <ng-template #header>
      <tr>
        <th>
          <p-check-box
            id="select-all-comic-files"
            [binary]="true"
            [ngModel]="comicFileCount() === comicFileSelectedCount()"
            (onChange)="onSelectAll($event.checked)"
          />
        </th>
        <th>{{ "import-comics-page.label.base-filename" | translate }}</th>
        <th>{{ "import-comics-page.label.size" | translate }}</th>
      </tr>
    </ng-template>

    <ng-template #body let-file>
      <tr>
        <td>
          <p-check-box
            [id]="`select-comic-file-checkbox-${file.id}`"
            [binary]="true"
            [ngModel]="file.selected"
            (onChange)="onSelectComicFile(file, $event.checked)"
          />
        </td>
        <td>
          <span [pTooltip]="file.filename">{{ file.baseFilename }}</span>
        </td>
        <td>
          {{
            "import-comics-page.text.size"
              | translate
                : { size: (file.size / (1024 * 1024) | number: "1.2-2") }
          }}
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
